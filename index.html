/main><script>
const editions={"2026-07-29":[{"tag":"艺术美学","title":"数字艺术，终于不再是艺术市场的“旁支”","summary":"Art Basel 对 2026 年的观察显示，数字艺术在高净值收藏者的品类支出中已升至第三，仅次于绘画与雕塑。艺术与技术的关系，正在从“新奇媒介”变成稳定的收藏语言。","why":"对设计师更值得看的不是 NFT，而是：屏幕原生作品开始拥有自己的展示、叙事与价值体系。","source":"Art Basel","url":"https://www.artbasel.com/stories/art-market-trends-watch-2026-experience-digital-middle-east-private-sales?lang=zh_CN","tone":"lilac","detail":["Art Basel 对 2026 年的观察显示，数字艺术在高净值收藏者的品类支出中已升至第三，仅次于绘画与雕塑。艺术与技术的关系，正在从“新奇媒介”变成稳定的收藏语言。","进一步看，这不是一次孤立的风潮，而是艺术机构、交易机制与观看媒介共同变化的结果。值得留意数字作品如何被展示、保存和定价。","我的阅读结论：对设计师更值得看的不是 NFT，而是：屏幕原生作品开始拥有自己的展示、叙事与价值体系。"],"languageNote":"原文为外语，以下为完整要点的中文精读整理。"},{"tag":"穿搭流行","title":"早秋最妙的颜色，是一整盘“红椒色”","summary":"焦橘、酒红、砖红与暖蜜桃被组合成同色系穿搭。重点并非上下完全同色，而是靠材质和明度差制造层次。","why":"可借鉴的重点不是追逐单一流行色，而是用同色系的材质与明度差制造成熟层次。","source":"VOGUE Taiwan","url":"https://www.vogue.com.tw/article/pre-fall-2026-trends","tone":"peach","detail":["焦橘、酒红、砖红与暖蜜桃被组合成同色系穿搭。重点并非上下完全同色，而是靠材质和明度差制造层次。","落到日常搭配，重点不是复制秀场，而是提取色彩关系、比例和材质逻辑。用已有衣物做小幅调整，比为了趋势重买整套更聪明。","我的阅读结论：可借鉴的重点不是追逐单一流行色，而是用同色系的材质与明度差制造成熟层次。"],"languageNote":"以下为中文精读整理。"},{"tag":"新生活概念","title":"生活不再“大改版”：Reflection over rebranding","summary":"2026 年的慢生活叙事正在从精致摆拍转向一种更诚实的实践：恢复模拟爱好、允许不完美、庆祝小进展，不再把每个新年都变成自我改造工程。","why":"它提供了一种反绩效化的生活框架：让长期目标持续推进，同时不把每天都变成高强度改造工程。","source":"Trill","url":"https://www.trillmag.com/lifestyle/health-wellbeing/reflection-over-rebranding-how-gen-z-is-choosing-slow-living-in-2026/","tone":"sage","detail":["2026 年的慢生活叙事正在从精致摆拍转向一种更诚实的实践：恢复模拟爱好、允许不完美、庆祝小进展，不再把每个新年都变成自我改造工程。","这个概念的价值在于，它把生活方式从消费标签拉回可执行的日常：节奏、注意力、关系与长期兴趣，比精心布置的照片更重要。","我的阅读结论：它提供了一种反绩效化的生活框架：让长期目标持续推进，同时不把每天都变成高强度改造工程。"],"languageNote":"原文为外语，以下为完整要点的中文精读整理。"},{"tag":"女性力量","title":"刚果东部的女人，用音乐节对抗战争的噤声","summary":"在冲突持续的戈马，由女性主导的 Musika na Kipaji 音乐节聚集约 3,000 人，以音乐反对性别暴力、重建社区联结。她们没有浪漫化苦难，而是在暴力中夺回公共表达。","why":"女性力量不只是“成为强者”，也包括在秩序崩塌时继续制造文化、快乐与共同体。","source":"AP News","url":"https://apnews.com/article/3fc3527a2ec723d10a8f14edcfd976fb","tone":"blue","detail":["在冲突持续的戈马，由女性主导的 Musika na Kipaji 音乐节聚集约 3,000 人，以音乐反对性别暴力、重建社区联结。她们没有浪漫化苦难，而是在暴力中夺回公共表达。","这里的“力量”不是把苦难包装成励志故事，而是女性在资源匮乏和结构性暴力中仍然组织行动、创造公共空间，并让彼此被看见。","我的阅读结论：女性力量不只是“成为强者”，也包括在秩序崩塌时继续制造文化、快乐与共同体。"],"languageNote":"原文为外语，以下为完整要点的中文精读整理。"},{"tag":"女性困境","title":"苏丹女性取一桶水，要在无人机与性暴力之间选择","summary":"苏丹奥贝德的缺水迫使女性白天冒着无人机袭击取水，夜间又面临强奸风险。全苏丹已有超过 1,270 万女性和女孩需要性别暴力相关服务。","why":"战争并非“男女共同受苦”的中性事件；基础设施崩溃会把性别结构放大成致命风险。","source":"Reuters","url":"https://www.reuters.com/world/africa/women-sudans-al-obeid-face-drone-attacks-rape-when-fetching-water-un-says-2026-07-24/","tone":"rose","detail":["苏丹奥贝德的缺水迫使女性白天冒着无人机袭击取水，夜间又面临强奸风险。全苏丹已有超过 1,270 万女性和女孩需要性别暴力相关服务。","理解这条新闻需要看见性别并非附加变量。战争、贫困和基础设施崩溃会沿着原有权力结构分配风险，女性承担的代价往往更隐蔽也更持久。","我的阅读结论：战争并非“男女共同受苦”的中性事件；基础设施崩溃会把性别结构放大成致命风险。"],"languageNote":"原文为外语，以下为完整要点的中文精读整理。"},{"tag":"女权新思想","title":"照护经济：GDP 看不见的劳动，才托住了世界","summary":"女性主义经济学持续把无偿照护、家务与情绪劳动拉回经济分析中心。它追问的不是女性如何更高效地加入旧系统，而是旧系统为何把维系生命的劳动定价为零。","why":"这比“女性也能像男人一样成功”更往前一步：它开始重写什么才算成功、生产与价值。","source":"Feminist Economics","url":"https://www.tandfonline.com/journals/rfec20","tone":"sand","detail":["女性主义经济学持续把无偿照护、家务与情绪劳动拉回经济分析中心。它追问的不是女性如何更高效地加入旧系统，而是旧系统为何把维系生命的劳动定价为零。","它把问题从“女性怎样适应现有规则”推进到“规则本身如何定义价值”。这类思想适合用来检查工作、家庭与照护中那些被默认免费的劳动。","我的阅读结论：这比“女性也能像男人一样成功”更往前一步：它开始重写什么才算成功、生产与价值。"],"languageNote":"原文为外语，以下为完整要点的中文精读整理。"},{"tag":"AI 资讯","title":"GPT‑5.6 把“照着现有设计系统做”变得更靠谱","summary":"OpenAI 最新旗舰系列强调复杂工作与模板遵循能力，官方展示中特别提到：可识别参考文件里的版式、字体、间距、颜色与重复规律，并延续到新内容中。","why":"对 UI 工作最直接的变化，是 AI 从“做一张像样的图”走向“遵守一套设计系统持续生产”。","source":"OpenAI","url":"https://openai.com/index/gpt-5-6/","tone":"cyan","detail":["OpenAI 最新旗舰系列强调复杂工作与模板遵循能力，官方展示中特别提到：可识别参考文件里的版式、字体、间距、颜色与重复规律，并延续到新内容中。","对普通使用者来说，真正重要的不是参数规模，而是能力边界、使用成本、可靠性和它能否嵌入真实工作流。产品宣传仍需结合实际测试判断。","我的阅读结论：对 UI 工作最直接的变化，是 AI 从“做一张像样的图”走向“遵守一套设计系统持续生产”。"],"languageNote":"原文为外语，以下为完整要点的中文精读整理。"},{"tag":"AI × 设计","title":"Figma 的 AI 工具清单，重点已从生图转向工作流","summary":"Figma 新整理的 2026 UX AI 工具方向包括设计上下文、Agent 框架、MCP、A/B 测试、可用性测试和应用构建。AI 的战场正从单点生成移向端到端协作。","why":"真正会拉开设计师差距的，不是提示词花活，而是你能否让 AI 读 或官方活动话题，并给出可验证的帖子或话题入口。","每次至少回答四个问题：热点是什么、热度信号是什么、适合怎样的视频结构、如何避免照搬。无法核验时会直接标注缺数，不虚构排名。"],"languageNote":"本卡为数据可用性说明。"},{"tag":"抖音创作热点","rank":"近 48h · 1209万热度","title":"视频话题：让旅行回忆替我们降降温吧","summary":"抖音公开热榜显示，该话题抓取时约1209万热度。它不是单纯的社会新闻，而是普通创作者可以直接参与的视频母题：用旧旅行素材、清凉色调和感官记忆，为盛夏制造一次“视觉降温”。","why":"最适合的不是硬拍新旅行，而是盘活相册库存：3秒高温现实开场，接冷色旅行片段，再用一句具体感官记忆收尾。","source":"抖音热榜","url":"https://www.douyin.com/hot","tone":"yellow","detail":["可拍选题一：翻出手机里最凉快的一段旅行。用“今天多少度”作为现实开场，切入雪山、海边、森林、雨天或夜风素材，形成温度反差。","可拍选题二：不展示景点攻略，只讲一个能让人瞬间回到旅途的感官细节，例如海水味、民宿空调声、山里凌晨的雾或便利店冰杯。","视频结构建议：前3秒给出暑热痛点；中段用3至6个短镜头完成降温；结尾留一句可被评论区接龙的问题。可使用话题 #让旅行回忆替我们降降温吧，并结合具体目的地与夏日生活标签。","风险提醒：避免只做空镜拼贴。加入人物感受、一个小意外或一个具体物件，才更容易从大量同质旅行素材中被记住。"],"languageNote":"以下为基于公开热榜的创作拆解。"},{"tag":"Lake 的意外投递","title":"全球癌症报告真正提醒的，不只是治病","summary":"WHO 2026 全球癌症状况报告把重点放在疾病负担、预防、公平可及与医疗系统差距。很多癌症风险并非纯粹的个人生活选择，而与筛查资源和公共系统有关。","why":"值得保留的视角是：不要把系统性健康风险全部归咎于个人选择，筛查资源与公共系统同样关键。","source":"WHO","url":"https://www.who.int/publications/i/item/9789240123977","tone":"stone","detail":["WHO 2026 全球癌症状况报告把重点放在疾病负担、预防、公平可及与医疗系统差距。很多癌症风险并非纯粹的个人生活选择，而与筛查资源和公共系统有关。","这条被选中，是因为它可能不在日常兴趣半径内，却会影响长期判断或实际生活。它承担的是日报里“打破信息茧房”的位置。","我的阅读结论：值得保留的视角是：不要把系统性健康风险全部归咎于个人选择，筛查资源与公共系统同样关键。"],"languageNote":"原文为外语，以下为完整要点的中文精读整理。"}]};
const tones=["#E7E0EF","#F2DED3","#DCE6D7","#D9E4EC","#EAD8DA","#E8E0D2","#D8E8E8","#DDE9E1","#EEE8D8","#E2DCEC","#EAD9D2","#ECE5C9","#DEDFDC"];

function render(){
 const cards=editions[selected]||[];
 document.querySelector("#date").textContent=selected.replaceAll("-",".");
 document.querySelector("#count").textContent=cards.length+" 条精选 · 约 12 分钟读完";
 document.querySelector("#stream").innerHTML=cards.map((c,i)=>`<article class="card" style="background:${tones[i%tones.length]}"><div class="meta"><span>${esc(c.tag)}</span>${c.rank?`<b>${esc(c.rank)}</b>`:""}<i>${String(i+1).padStart(2,"0")}</i></div><h2>${esc(c.title)}</h2><p class="summary">${esc(c.summary)}</p><div class="why"><small>LAKE 说</small><p>${esc(c.why)}</p></div><div class="sourceBar"><span>${esc(c.source)}</span><button class="expandButton" data-expand="${i}" aria-label="展开中文精读" aria-expanded="false">⌄</button></div><div class="expanded" id="expanded-${i}">${c.image?`<img src="${esc(c.image)}" alt="" loading="lazy">`:""}<p class="languageNote">${esc(c.languageNote||"以下为中文精读整理。")}</p>${(c.detail||[c.summary]).map(p=>`<p>${esc(p)}</p>`).join("")}<a class="originalLink" href="${esc(c.url)}" target="_blank" rel="noreferrer">查看原文 <span>↗</span></a></div></article>`).join("");
 document.querySelectorAll(".expandButton").forEach(btn=>btn.onclick=()=>{const panel=document.querySelector("#expanded-"+btn.dataset.expand);const open=panel.classList.toggle("open");btn.classList.toggle("open",open);btn.setAttribute("aria-expanded",String(open));btn.setAttribute("aria-label",open?"收起中文精读":"展开中文精读")});
}
document.querySelector("#calendarToggle").onclick=()=>document.querySelector("#calendar").classList.toggle("show");
